# Production Environment Configuration
spring.application.name=Smash-Scoreboard
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_PROD_DB}
spring.datasource.username=${POSTGRES_PROD_USER}
spring.datasource.password=${POSTGRES_PROD_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# Valid options for ddl-auto: none, create-only, create, create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.ssbu_league=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.session=WARN
logging.level.org.hibernate=WARN

# Security settings
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Disable development tools
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Docker Compose Configuration for Production
# Disabled in prod: spring-boot-docker-compose is a development-only feature.
# In production the app must NOT try to manage docker compose from inside its
# own container (no docker socket/compose file there). Containers are managed
# by `docker compose` on the host instead.
spring.docker.compose.enabled=false